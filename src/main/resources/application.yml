server:
  # Render sets PORT; locally the app runs on 8080
  port: ${PORT:8080}

spring:
  application:
    name: ragdemo
  config:
    # Optional, git-ignored file next to the jar / project root for YOUR local keys (never committed).
    import: optional:file:./application-local.yml
  threads:
    virtual:
      enabled: true   # blocking calls (Weaviate, Laya, OpenRouter) run on virtual threads
  datasource:
    # A local FILE database: keys survive a local restart. On Render the disk is not persistent,
    # so a restart / redeploy starts empty and the keys are entered again in Key Management.
    url: jdbc:h2:file:./data/ragdemo;AUTO_SERVER=FALSE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

vaadin:
  launch-browser: false
  allowed-packages: com.vaadin,org.vaadin,com.example.ragdemo

management:
  endpoints:
    web:
      exposure:
        include: health

# Defaults for Key Management, used when nothing was saved there. Empty on purpose: NEVER put a key in this file.
# Set them locally with environment variables, or in the git-ignored ./application-local.yml (see README → Run).
ragdemo:
  defaults:
    weaviate:
      url: ${RAGDEMO_WEAVIATE_URL:}
      key: ${RAGDEMO_WEAVIATE_KEY:}
    system2:
      key: ${RAGDEMO_OPENROUTER_KEY:}

# Code-flow logs: one line per RAG step (+ details at DEBUG). DEBUG locally, INFO on Render (set in the Dockerfile).
logging:
  level:
    com.example.ragdemo: ${RAGDEMO_LOG_LEVEL:DEBUG}
