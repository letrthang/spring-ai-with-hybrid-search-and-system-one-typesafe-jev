server:
  # Render sets PORT; locally the app runs on 8080
  port: ${PORT:8080}
  # On a redeploy Render stops the old instance: finish the requests in flight first, then close the database.
  shutdown: graceful

spring:
  application:
    name: ragdemo
  config:
    # Optional, git-ignored file next to the jar / project root for YOUR local keys (never committed).
    import: optional:file:./application-local.yml
  threads:
    virtual:
      enabled: true   # blocking calls (Weaviate, Laya, OpenRouter) run on virtual threads
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # A local FILE database: keys saved in Key Management and the chat history survive a local restart. On Render
    # the disk is not persistent: a restart / redeploy starts empty (the default keys come from environment variables).
    # DB_CLOSE_ON_EXIT=FALSE: Spring closes H2 after the web server has stopped — not the JVM's shutdown hook, which
    # closed it while the old instance was still answering ("Database is already closed" during every redeploy).
    url: jdbc:h2:file:./data/ragdemo;AUTO_SERVER=FALSE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    # HikariCP connection pool: small for a 512 MB instance. Each connection is checked before it is lent out and
    # retired after max-lifetime / idle-timeout — a stale connection is closed before a new one is opened.
    hikari:
      pool-name: ragdemo-h2
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000   # ms to wait for a free connection
      idle-timeout: 300000        # close connections idle for 5 min
      max-lifetime: 1800000       # replace every connection after 30 min
      keepalive-time: 120000      # check idle connections every 2 min
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

vaadin:
  launch-browser: false
  allowed-packages: com.vaadin,org.vaadin,com.example.ragdemo

management:
  endpoints:
    web:
      exposure:
        include: health

# Defaults for Key Management, used when nothing was saved there. Empty on purpose: NEVER put a key in this file.
# Set them locally with environment variables, or in the git-ignored ./application-local.yml (see README → Run).
ragdemo:
  defaults:
    weaviate:
      url: ${RAGDEMO_WEAVIATE_URL:}
      key: ${RAGDEMO_WEAVIATE_KEY:}
    system2:
      key: ${RAGDEMO_OPENROUTER_KEY:}

# Code-flow logs: one line per RAG step (+ details at DEBUG). DEBUG locally, INFO on Render (set in the Dockerfile).
logging:
  level:
    com.example.ragdemo: ${RAGDEMO_LOG_LEVEL:DEBUG}
