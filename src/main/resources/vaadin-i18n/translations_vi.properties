# ---- ℹ️ learning hints
hint.RAG.name=💡 RAG
hint.RAG.title=💡 RAG — Sinh văn bản có truy xuất (Retrieval-Augmented Generation)
hint.RAG.what=Cách để mô hình AI trả lời dựa trên tài liệu của bạn thay vì chỉ dựa vào trí nhớ của nó.
hint.RAG.does=Ứng dụng này tìm các đoạn văn trong Weaviate, để Hệ thống 1 giữ lại những đoạn hữu ích, rồi đưa chúng cho Hệ thống 2 viết câu trả lời — kèm trích dẫn đánh số để bạn kiểm tra.
hint.RAG.theory=Mô hình ngôn ngữ chỉ biết những gì nó thấy khi huấn luyện và có thể bịa ra sự kiện ("ảo giác"). Đưa đúng các đoạn văn vào prompt (truy xuất + bổ sung) giúp câu trả lời dựa trên văn bản thật.
hint.WEAVIATE.name=🗄️ Weaviate
hint.WEAVIATE.title=🗄️ Weaviate — cơ sở dữ liệu vector
hint.WEAVIATE.what=Một cơ sở dữ liệu lưu mỗi đoạn văn hai lần: dưới dạng từ ngữ (để tìm theo từ khóa) và dưới dạng vector (để tìm theo ý nghĩa).
hint.WEAVIATE.does=Chứa 1.500 đoạn văn mẫu (mỗi thứ tiếng Anh, Việt, Nhật 500 đoạn) trong collection DemoDoc và thực hiện hai lần tìm cho mỗi câu hỏi: BM25 và nearText. Nó cũng tự biến văn bản thành vector (bộ vector hóa tích hợp sẵn).
hint.WEAVIATE.theory=Cơ sở dữ liệu truyền thống tìm giá trị chính xác. Cơ sở dữ liệu vector tìm các vector gần nhất — những văn bản có ý nghĩa tương tự — nhờ một chỉ mục để không phải so sánh với mọi vector.
hint.SYSTEM1.name=⚡ Hệ thống 1
hint.SYSTEM1.title=⚡ Hệ thống 1 — Laya, một mô hình quyết định
hint.SYSTEM1.what=Một mô hình nhỏ, nhanh, trả lời câu hỏi có/không bằng một xác suất (từ 0 đến 1). Nó không bao giờ viết văn bản.
hint.SYSTEM1.does=Với mỗi đoạn văn, nó trả lời ba câu hỏi — có liên quan không? có trả lời được không? có phải tiêm lệnh không? — rồi đoạn đó được giữ hoặc bị loại. Các đoạn được giữ được sắp xếp theo điểm "trả lời".
hint.SYSTEM1.theory="Hệ thống 1 / Hệ thống 2" đến từ Daniel Kahneman: trực giác nhanh và suy luận chậm. Ở đây một mô hình rẻ, nhanh làm bộ lọc, để mô hình đắt chỉ đọc những gì đáng đọc.
hint.SYSTEM2.name=🧠 Hệ thống 2
hint.SYSTEM2.title=🧠 Hệ thống 2 — mô hình ngôn ngữ lớn (LLM)
hint.SYSTEM2.what=Một mô hình AI đa năng viết văn bản. Ở đây: các mô hình miễn phí trên OpenRouter, thử lần lượt.
hint.SYSTEM2.does=Nhận câu hỏi cùng các đoạn văn Hệ thống 1 giữ lại, đánh số [1], [2]…, và viết một câu trả lời ngắn có trích dẫn. Nếu một mô hình đang bận (429), mô hình tiếp theo trong danh sách sẽ được thử.
hint.SYSTEM2.theory=LLM dự đoán token tiếp theo (một mẩu của từ) lặp đi lặp lại. Nó giỏi ngôn ngữ, nhưng cần dữ kiện trong prompt để đáng tin — đó chính là điều RAG mang lại.
hint.BM25.name=🔤 BM25
hint.BM25.title=🔤 BM25 — tìm theo từ khóa
hint.BM25.what=Cách xếp hạng kinh điển của công cụ tìm kiếm: đoạn văn chứa các từ của câu hỏi được điểm cao hơn.
hint.BM25.does=Weaviate xếp hạng đoạn văn bằng BM25 trên title (tính gấp đôi) và body. Điểm được hiển thị trong 🔎 Tìm dữ liệu và dưới dạng "BM25 #hạng" trong 📚 Nguồn.
hint.BM25.theory=BM25 thưởng cho từ hiếm ("PCR", "Cas9") nhiều hơn từ phổ biến ("the"), và cho những từ xuất hiện nhiều trong một đoạn ngắn. Rất tốt cho tên và mã chính xác; nhưng không hiểu từ đồng nghĩa.
hint.VECTOR.name=🧭 Tìm vector
hint.VECTOR.title=🧭 Tìm vector — tìm theo ý nghĩa
hint.VECTOR.what=Mỗi văn bản trở thành một dãy số (embedding / vector). Các văn bản có ý nghĩa giống nhau có vector gần nhau.
hint.VECTOR.does=Weaviate biến câu hỏi thành vector và trả về những đoạn văn có vector gần nhất. "Khoảng cách" cho biết chúng xa nhau bao nhiêu: càng nhỏ càng giống.
hint.VECTOR.theory=Mô hình embedding được huấn luyện để "nước ấm chứa ít oxy hơn" nằm gần "độ hòa tan của khí giảm khi nhiệt độ tăng" dù không có từ chung. Khoảng cách ở đây là khoảng cách cosine (góc giữa các vector).
hint.RRF.name=🔀 RRF
hint.RRF.title=🔀 RRF — Hợp nhất thứ hạng nghịch đảo (tìm kiếm lai)
hint.RRF.what=Một cách đơn giản để gộp hai danh sách đã xếp hạng thành một.
hint.RRF.does=Mỗi đoạn văn nhận 1 / (60 + hạng) từ danh sách BM25 và từ danh sách vector; hai phần được cộng lại. 4 đoạn đầu được chuyển cho Hệ thống 1.
hint.RRF.theory=RRF chỉ dùng thứ hạng, không dùng điểm gốc, nên điểm BM25 (0…∞) và khoảng cách (0…2) có thể kết hợp mà không cần tinh chỉnh. Đoạn văn tốt ở cả hai danh sách sẽ thắng. Bài báo: Cormack và cộng sự, 2009.
hint.LAYA_SCORES.name=⚡ liên quan · trả lời · tiêm lệnh
hint.LAYA_SCORES.title=⚡ liên quan · trả lời · tiêm lệnh
hint.LAYA_SCORES.what=Ba xác suất mà Hệ thống 1 đưa ra cho mỗi đoạn văn.
hint.LAYA_SCORES.does=Chỉ giữ khi liên quan ≥ 0.45, trả lời ≥ 0.55 và tiêm lệnh < 0.70 (cùng ngưỡng mà blog Spring AI dùng cho Jev). Sau đó sắp xếp theo "trả lời"; 3 đoạn tốt nhất được chuyển cho Hệ thống 2.
hint.LAYA_SCORES.theory=Đây là các xác suất có/không đã được hiệu chỉnh, không phải văn bản. Ngưỡng biến xác suất thành quyết định — hạ thấp để giữ nhiều hơn, nâng lên để khắt khe hơn.
hint.INJECTION.name=🛡️ Tiêm lệnh
hint.INJECTION.title=🛡️ Tiêm lệnh (prompt injection)
hint.INJECTION.what=Văn bản ẩn trong tài liệu cố gắng ra lệnh cho AI ("bỏ qua mọi hướng dẫn trước đó…").
hint.INJECTION.does=Hệ thống 1 chấm điểm mọi đoạn văn về điều này; đoạn có khả năng là tiêm lệnh bị loại trước khi Hệ thống 2 nhìn thấy. Dữ liệu mẫu có cài sẵn một ghi chú để minh họa.
hint.INJECTION.theory=RAG đưa văn bản bên ngoài vào prompt, nên văn bản đó có thể tìm cách chiếm quyền điều khiển. Lọc trước khi sinh văn bản là một lớp phòng thủ; đây là rủi ro số 1 trong OWASP Top 10 cho ứng dụng LLM.
hint.SOURCES.name=📚 Nguồn
hint.SOURCES.title=📚 Nguồn
hint.SOURCES.what=Mọi đoạn văn mà lần tìm đã thấy cho câu hỏi này, và điều gì đã xảy ra với chúng.
hint.SOURCES.does=Hiển thị hạng BM25, hạng vector, điểm RRF, ba điểm của Hệ thống 1 và ✅ giữ lại / 🚫 bị loại của từng đoạn. [n] đánh dấu các đoạn đã đưa cho Hệ thống 2 và có thể được trích dẫn.
hint.SOURCES.theory=Hiển thị nguồn giúp câu trả lời của AI có thể kiểm chứng — một ý tưởng cốt lõi của RAG.
hint.TRACE.name=🔬 Dấu vết
hint.TRACE.title=🔬 Dấu vết
hint.TRACE.what=Thời gian và con số của từng bước trong câu trả lời này.
hint.TRACE.does=Weaviate, Hệ thống 1 và Hệ thống 2 mất bao lâu, mô hình nào đã trả lời, bao nhiêu token vào và ra, và những mô hình nào bị bỏ qua.
hint.TRACE.theory=Token là một mẩu của từ (khoảng ¾ một từ tiếng Anh). Các mô hình bị giới hạn và tính giá theo token.
hint.DATA_FLOW.name=🔀 Luồng dữ liệu
hint.DATA_FLOW.title=🔀 Luồng dữ liệu
hint.DATA_FLOW.what=Toàn bộ hành trình của một câu hỏi dưới dạng sơ đồ tuần tự.
hint.DATA_FLOW.does=Mỗi thành phần một cột (Người dùng, Ứng dụng, Weaviate, Hệ thống 1, Hệ thống 2), mỗi bước một mũi tên đánh số kèm thời điểm bắt đầu và thời lượng. Nét liền = lời gọi, nét đứt xanh lá = phản hồi, vòng lặp = xử lý bên trong ứng dụng.
hint.DATA_FLOW.theory=Sơ đồ tuần tự đến từ UML; chúng cho thấy ai nói chuyện với ai, theo thứ tự nào — cách tốt nhất để hiểu một pipeline.
hint.PROGRESS.name=⏳ Tiến trình
hint.PROGRESS.title=⏳ Các bước tiến trình
hint.PROGRESS.what=Câu hỏi của bạn đang ở đâu ngay lúc này.
hint.PROGRESS.does=🗄️ đang tìm trong Weaviate → ⚡ Hệ thống 1 đang kiểm tra đoạn văn → 🧠 Hệ thống 2 đang viết. ⛔ đánh dấu bước có dịch vụ bị lỗi; ➖ nghĩa là không cần Hệ thống 2 (không có đoạn nào được giữ).
hint.PROGRESS.theory=Mỗi bước tự báo cáo khi bắt đầu, và trang được cập nhật trực tiếp (server push).
hint.FAIL_CLOSED.name=🚦 Trạng thái dịch vụ
hint.FAIL_CLOSED.title=🚦 Trạng thái dịch vụ — đóng khi lỗi (fail closed)
hint.FAIL_CLOSED.what=Cả ba dịch vụ đều bắt buộc. 🟢 sẵn sàng · 🟡 đang khởi động / bận / chưa có dữ liệu · 🔴 ngừng hoạt động.
hint.FAIL_CLOSED.does=Nếu bất kỳ dịch vụ nào không 🟢, trò chuyện bị tắt và biểu ngữ cho biết lý do. Trạng thái được kiểm tra mỗi 30 giây.
hint.FAIL_CLOSED.theory="Đóng khi lỗi" nghĩa là: khi một bước an toàn không chạy được, thà không làm gì còn hơn tiếp tục mà thiếu nó — để không đoạn văn nào chưa kiểm tra đến được LLM.
hint.HISTORY.name=📂 Lịch sử
hint.HISTORY.title=📂 Lịch sử
hint.HISTORY.what=Mọi cuộc trò chuyện, được lưu trong cơ sở dữ liệu H2 cục bộ của ứng dụng.
hint.HISTORY.does=Nhấp vào một dòng để xem thẻ tóm tắt, nhấp đúp để đọc kèm Nguồn, Dấu vết và Luồng dữ liệu; ▶ Tiếp tục tại đây để hỏi thêm trong cùng cuộc trò chuyện.
hint.HISTORY.theory=Mỗi câu trả lời được lưu cùng toàn bộ dấu vết dưới dạng JSON, nên có thể hiển thị lại đúng như lúc xảy ra. Trên Render, cơ sở dữ liệu bị xóa sau mỗi lần khởi động lại.
hint.SEARCH_MODES.name=🔎 Chế độ tìm
hint.SEARCH_MODES.title=🔎 BM25 · Vector · Lai
hint.SEARCH_MODES.what=Ba cách tìm trên cùng các đoạn văn.
hint.SEARCH_MODES.does=BM25 = theo từ ngữ, Vector = theo ý nghĩa, Lai = gộp cả hai bằng RRF (cách trò chuyện sử dụng). Chỉ hiển thị các cột mà chế độ đó có dữ liệu.
hint.SEARCH_MODES.theory=Hãy thử một câu hỏi từ khóa ("định luật thứ hai của Newton") và một câu hỏi theo ý nghĩa ("vì sao nước ấm chứa ít oxy hơn") ở từng chế độ và so sánh thứ hạng.
hint.ROW_ORDER.name=# Vị trí
hint.ROW_ORDER.title=# — vị trí trong danh sách này
hint.ROW_ORDER.what=Đoạn văn này đứng ở đâu trong danh sách bạn đang xem.
hint.ROW_ORDER.does=Sau một lần tìm, đây là thứ tự cuối cùng: theo điểm RRF ở chế độ Lai, theo điểm BM25 ở BM25, theo khoảng cách vector ở Vector. Khi truy vấn trống, đó chỉ là thứ tự Weaviate trả về các đối tượng — không có xếp hạng.
hint.ROW_ORDER.theory=Nhiệm vụ của công cụ tìm kiếm là sắp xếp: đầu danh sách là thứ nó cho là phù hợp nhất. So sánh ba chế độ để thấy các phương pháp khác nhau cho thứ tự khác nhau với cùng một câu hỏi.
hint.CHUNKS.name=📥 Đoạn văn
hint.CHUNKS.title=📥 Đoạn văn (chunk)
hint.CHUNKS.what=Những mẩu nhỏ của tài liệu — ở đây mỗi "## mục" của từng tệp mẫu là một đoạn.
hint.CHUNKS.does=📥 Nạp dữ liệu mẫu sẽ xóa collection, tạo lại và chèn mọi đoạn văn. Weaviate tạo vector cho từng đoạn trong lúc chèn.
hint.CHUNKS.theory=Tìm kiếm hoạt động trên đoạn văn, không phải cả tài liệu: một đoạn ngắn, tập trung khớp câu hỏi tốt hơn và vừa với prompt. Tách theo tiêu đề giúp mỗi đoạn chỉ nói về một chủ đề.
hint.RECORD.name=🧾 Bản ghi
hint.RECORD.title=🧾 Một bản ghi Weaviate (đối tượng)
hint.RECORD.what=Một đoạn văn được lưu: id (UUID), các trường (properties) và vector của nó.
hint.RECORD.does=Nằm trong cụm → collection DemoDoc → UUID đối tượng. UUID được tạo từ "tệp#mục", nên nạp lại vẫn ra cùng id. Bạn có thể lấy nó tại địa chỉ REST được hiển thị.
hint.RECORD.theory=UUID là một id 128 bit; UUID dựa trên tên (phiên bản 3) luôn cho cùng một id với cùng một tên.
hint.SCHEMA.name=🧱 Cấu trúc dữ liệu
hint.SCHEMA.title=🧱 Cấu trúc dữ liệu (schema của collection)
hint.SCHEMA.what=Các trường mà mọi đoạn văn có và cách Weaviate lập chỉ mục từng trường.
hint.SCHEMA.does=title và body được tách thành từ cho BM25 (title tính gấp đôi) và là nguồn tạo vector; source và chunkNo chỉ dùng để lọc.
hint.SCHEMA.theory=Có hai loại chỉ mục: chỉ mục đảo (từ → đoạn văn) cho BM25, và chỉ mục vector (ở đây là HFresh, Weaviate Cloud yêu cầu) để tìm vector gần nhất mà không phải so sánh tất cả.
hint.EMBEDDING.name=🧮 Vector
hint.EMBEDDING.title=🧮 Vector (embedding)
hint.EMBEDDING.what=Dãy số Weaviate tạo cho đoạn văn này — gồm 1024 số.
hint.EMBEDDING.does=Do bộ vector hóa tích hợp của Weaviate tạo từ title + body. Câu hỏi cũng được tạo vector theo cách đó; những vector đoạn văn gần nhất là kết quả tìm vector.
hint.EMBEDDING.theory=Mỗi con số là một chiều ý nghĩa đã học; riêng một số không mang ý nghĩa gì. Các văn bản tương tự chỉ về cùng một hướng.
hint.KEYS.name=🔑 Khóa
hint.KEYS.title=🔑 Khóa
hint.KEYS.what=Chỉ hai dịch vụ cần khóa: Weaviate và OpenRouter. Laya (Hệ thống 1) là công khai.
hint.KEYS.does=Khóa lưu ở đây được ghi vào cơ sở dữ liệu H2 cục bộ và được đọc ở mỗi lần gọi, ưu tiên hơn khóa mặc định từ biến môi trường (RAGDEMO_WEAVIATE_URL, RAGDEMO_WEAVIATE_KEY, RAGDEMO_OPENROUTER_KEY). Trang chỉ hiển thị 4 ký tự cuối.
hint.KEYS.theory=Đừng bao giờ đưa khóa vào mã nguồn hay git: hãy đặt nó làm biến môi trường (Render → Environment, hoặc shell khi chạy cục bộ). Khóa đã lưu sẽ ghi đè cho đến khi 🗑 Xóa hoặc khởi động lại; ổ đĩa của Render không được giữ lại, còn biến môi trường thì có.
hint.MODELS.name=🧩 Mô hình
hint.MODELS.title=🧩 Các mô hình của Hệ thống 2
hint.MODELS.what=Các mô hình OpenRouter mà Hệ thống 2 có thể dùng, thử từ trên xuống dưới.
hint.MODELS.does=Chọn từ danh sách — 🆓 mô hình miễn phí ở trên, 💲 trả phí ở dưới (khóa có hạn mức $0 chỉ dùng được mô hình miễn phí). ↑ ↓ đặt thứ tự dự phòng; mô hình bận sẽ nhường cho mô hình tiếp theo.
hint.MODELS.theory=Ngữ cảnh = số token mô hình đọc được một lần. "tools" = mô hình có thể gọi hàm. Giá tính cho mỗi triệu token vào (prompt) và ra (câu trả lời).
