# ---- key management
keys.title=🔑 Quản lý khóa
keys.intro=Chỉ hai dịch vụ cần khóa: Weaviate và OpenRouter. Chủ trang đã đặt khóa mặc định (biến môi trường), nên demo dùng được ngay. Khóa bạn lưu ở đây sẽ được dùng thay thế, đọc ở mỗi lần gọi; 🗑 Xóa / 🔄 Mặc định quay về khóa của chủ trang. Khóa đã lưu nằm trong cơ sở dữ liệu cục bộ của ứng dụng, bị Render xóa sau mỗi lần khởi động lại.
