# ---- key management
keys.title=🔑 キー管理
keys.intro=キーが必要なのは Weaviate と OpenRouter の 2 つだけです。サイト管理者がデフォルトのキー（環境変数）を設定しており、表示されることはありません。ここで入力したキーが代わりに使われ、呼び出しのたびに読み込まれます。メモリにのみ保持され（データベースには書き込まれません）、再起動で消えます。🗑 クリア / 🔄 デフォルト で管理者のキーに戻ります。
keys.weaviate.title=🗄️ Weaviate
keys.weaviate.what=必須。パッセージを保存し、BM25 + ベクトル検索を実行します。Admin キーを使ってください: アプリがコレクションを作成し、サンプルデータを読み込みます。
