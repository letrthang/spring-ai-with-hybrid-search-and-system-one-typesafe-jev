# ---- ℹ️ learning hints
hint.RAG.name=💡 RAG
hint.RAG.title=💡 RAG — 検索拡張生成（Retrieval-Augmented Generation）
hint.RAG.what=AI モデルに、自分の記憶だけでなくあなたの文書に基づいて答えさせる方法です。
hint.RAG.does=このアプリは Weaviate でパッセージを探し、システム 1 に役立つものだけを残させ、それをシステム 2 に渡して回答を書かせます — 確認できるよう番号付きの引用も付けます。
hint.RAG.theory=言語モデルは学習時に見たことしか知らず、事実をでっち上げることがあります（「ハルシネーション」）。正しいパッセージをプロンプトに入れる（検索 + 拡張）ことで、回答を実際の文章に基づかせます。
hint.WEAVIATE.name=🗄️ Weaviate
hint.WEAVIATE.title=🗄️ Weaviate — ベクトルデータベース
hint.WEAVIATE.what=各パッセージを 2 通りに保存するデータベースです: 単語として（キーワード検索用）、ベクトルとして（意味検索用）。
hint.WEAVIATE.does=DemoDoc コレクションに 1,500 件のサンプルパッセージ（英語・ベトナム語・日本語で各 500 件）を保持し、質問ごとに BM25 と nearText の 2 つの検索を実行します。テキストからベクトルも自動で作ります（組み込みのベクトライザー）。
hint.WEAVIATE.theory=従来のデータベースは完全一致の値を探します。ベクトルデータベースは最も近いベクトル — 意味が似ているテキスト — を探し、インデックスを使うことですべてのベクトルと比較せずに済みます。
hint.SYSTEM1.name=⚡ システム 1
hint.SYSTEM1.title=⚡ システム 1 — Laya、判定モデル
hint.SYSTEM1.what=はい/いいえの質問に確率（0〜1）で答える、小さく高速なモデルです。文章は書きません。
hint.SYSTEM1.does=各パッセージについて 3 つの質問に答えます — 関連しているか？ 回答になるか？ インジェクションか？ — その結果、パッセージは採用または除外されます。採用されたものは「回答」スコア順に並べられます。
hint.SYSTEM1.theory=「システム 1 / システム 2」はダニエル・カーネマンに由来します: 速い直感と遅い推論。ここでは安価で速いモデルがフィルターとなり、高価なモデルは読む価値のあるものだけを読みます。
hint.SYSTEM2.name=🧠 システム 2
hint.SYSTEM2.title=🧠 システム 2 — 大規模言語モデル（LLM）
hint.SYSTEM2.what=文章を書く汎用 AI モデルです。ここでは OpenRouter の無料モデルを順番に試します。
hint.SYSTEM2.does=質問と、システム 1 が採用したパッセージ（[1]、[2]… と番号付け）を受け取り、引用付きの短い回答を書きます。モデルが混雑している（429）場合は、リストの次のモデルを試します。
hint.SYSTEM2.theory=LLM は次のトークン（単語の一部）を何度も予測します。言語は得意ですが、信頼できる回答にはプロンプト内の事実が必要です — それを提供するのが RAG です。
hint.BM25.name=🔤 BM25
hint.BM25.title=🔤 BM25 — キーワード検索
hint.BM25.what=検索エンジンの古典的なランキング手法: 質問の単語を含むパッセージほど高いスコアになります。
hint.BM25.does=Weaviate は title（2 倍の重み）と body に対する BM25 でパッセージを順位付けします。スコアは 🔎 データ検索に、また 📚 ソースでは「BM25 #順位」として表示されます。
hint.BM25.theory=BM25 は一般的な単語（「the」）より珍しい単語（「PCR」「Cas9」）を、また短いパッセージに何度も出てくる単語を高く評価します。正確な名前やコードに強い一方、同義語は理解しません。
hint.VECTOR.name=🧭 ベクトル検索
hint.VECTOR.title=🧭 ベクトル検索 — 意味で探す
hint.VECTOR.what=各テキストは数値のリスト（埋め込み / ベクトル）になります。意味が似たテキストは近いベクトルになります。
hint.VECTOR.does=Weaviate は質問をベクトルに変え、最も近いベクトルを持つパッセージを返します。「距離」はどれだけ離れているかを示し、小さいほど似ています。
hint.VECTOR.theory=埋め込みモデルは、共通の単語がなくても「温かい水は酸素が少ない」が「気体の溶解度は温度とともに下がる」の近くに来るよう学習されています。ここでの距離はコサイン距離（ベクトル間の角度）です。
hint.RRF.name=🔀 RRF
hint.RRF.title=🔀 RRF — 逆順位融合（ハイブリッド検索）
hint.RRF.what=2 つのランキングリストを 1 つにまとめるシンプルな方法です。
hint.RRF.does=各パッセージは BM25 リストとベクトルリストのそれぞれから 1 / (60 + 順位) を得て、その合計がスコアになります。上位 4 件がシステム 1 に渡されます。
hint.RRF.theory=RRF は生のスコアではなく順位だけを使うので、BM25 スコア（0…∞）と距離（0…2）を調整なしで組み合わせられます。両方のリストで上位のパッセージが勝ちます。論文: Cormack ほか、2009 年。
hint.LAYA_SCORES.name=⚡ 関連 · 回答 · インジェクション
hint.LAYA_SCORES.title=⚡ 関連 · 回答 · インジェクション
hint.LAYA_SCORES.what=システム 1 が各パッセージに付ける 3 つの確率です。
hint.LAYA_SCORES.does=関連 ≥ 0.45、回答 ≥ 0.55、インジェクション < 0.70 のときだけ採用します（Spring AI ブログが Jev に使っているのと同じしきい値）。その後「回答」順に並べ、上位 3 件がシステム 2 に渡されます。
hint.LAYA_SCORES.theory=これらはテキストではなく、較正されたはい/いいえの確率です。しきい値が確率を判定に変えます — 下げればより多く残り、上げればより厳しくなります。
hint.INJECTION.name=🛡️ インジェクション
hint.INJECTION.title=🛡️ プロンプトインジェクション
hint.INJECTION.what=文書の中に隠され、AI に命令しようとするテキストです（「以前の指示をすべて無視せよ…」）。
hint.INJECTION.does=システム 1 はすべてのパッセージをこの観点で採点し、インジェクションらしいものはシステム 2 が見る前に除外されます。サンプルデータには実演用のメモが 1 つ仕込まれています。
hint.INJECTION.theory=RAG は外部のテキストをプロンプトに入れるため、そのテキストが制御を奪おうとすることがあります。生成前のフィルタリングは防御の 1 層であり、LLM アプリ向け OWASP Top 10 のリスク第 1 位です。
hint.SOURCES.name=📚 ソース
hint.SOURCES.title=📚 ソース
hint.SOURCES.what=この質問で検索が見つけたすべてのパッセージと、それぞれに何が起きたか。
hint.SOURCES.does=各パッセージの BM25 順位、ベクトル順位、RRF スコア、システム 1 の 3 つのスコア、✅ 採用 / 🚫 除外 を表示します。[n] はシステム 2 に渡され、引用され得るパッセージを示します。
hint.SOURCES.theory=ソースを示すことで AI の回答を検証可能にします — RAG の中心的な考え方です。
hint.TRACE.name=🔬 トレース
hint.TRACE.title=🔬 トレース
hint.TRACE.what=この回答の各ステップの所要時間と数値です。
hint.TRACE.does=Weaviate、システム 1、システム 2 それぞれの所要時間、どのモデルが回答したか、入出力のトークン数、スキップされたモデルを示します。
hint.TRACE.theory=トークンは単語の一部です（英語の単語の約 ¾）。モデルはトークン単位で制限され、料金も計算されます。
hint.DATA_FLOW.name=🔀 データフロー
hint.DATA_FLOW.title=🔀 データフロー
hint.DATA_FLOW.what=1 つの質問がたどる全行程をシーケンス図で示したものです。
hint.DATA_FLOW.does=参加者ごとに 1 列（ユーザー、アプリ、Weaviate、システム 1、システム 2）、ステップごとに番号付きの矢印 1 本で、開始時刻と所要時間を表示します。実線 = 呼び出し、緑の破線 = 応答、ループ = アプリ内部の処理。
hint.DATA_FLOW.theory=シーケンス図は UML に由来し、誰が誰とどの順番でやり取りするかを示します — パイプラインを理解する最良の方法です。
hint.PROGRESS.name=⏳ 進行状況
hint.PROGRESS.title=⏳ 進行ステップ
hint.PROGRESS.what=あなたの質問が今どこにあるか。
hint.PROGRESS.does=🗄️ Weaviate を検索中 → ⚡ システム 1 がパッセージを確認中 → 🧠 システム 2 が作成中。⛔ は失敗したサービスのステップを示し、➖ はシステム 2 が不要だった（採用されたパッセージがない）ことを示します。
hint.PROGRESS.theory=各ステップは開始時に自分で報告し、ページはリアルタイムに更新されます（サーバープッシュ）。
hint.FAIL_CLOSED.name=🚦 サービス状態
hint.FAIL_CLOSED.title=🚦 サービス状態 — フェイルクローズ
hint.FAIL_CLOSED.what=3 つのサービスはすべて必須です。🟢 準備完了 · 🟡 起動中 / 混雑中 / データなし · 🔴 停止。
hint.FAIL_CLOSED.does=どれか 1 つでも 🟢 でなければチャットは無効になり、バナーに理由が表示されます。状態は 30 秒ごとに確認されます。
hint.FAIL_CLOSED.theory=「フェイルクローズ」とは: 安全のためのステップが実行できないとき、それなしで進めるより何もしないほうがよい、という考え方です — 確認されていないパッセージが LLM に届くことはありません。
hint.HISTORY.name=📂 履歴
hint.HISTORY.title=📂 履歴
hint.HISTORY.what=すべてのチャット。アプリのローカル H2 データベースに保存されます。
hint.HISTORY.does=行をクリックで要約カード、ダブルクリックでソース・トレース・データフロー付きで読めます。▶ ここで続ける で同じチャットに質問を追加できます。
hint.HISTORY.theory=各回答はトレース全体とともに JSON で保存されるので、当時のとおりに再表示できます。Render では再起動のたびにデータベースが消去されます。
hint.SEARCH_MODES.name=🔎 検索モード
hint.SEARCH_MODES.title=🔎 BM25 · ベクトル · ハイブリッド
hint.SEARCH_MODES.what=同じパッセージを検索する 3 つの方法です。
hint.SEARCH_MODES.does=BM25 = 単語で、ベクトル = 意味で、ハイブリッド = 両方を RRF で統合（チャットが使う方法）。そのモードでデータがある列だけが表示されます。
hint.SEARCH_MODES.theory=キーワード型の質問（「ニュートンの第二法則」）と意味型の質問（「温かい水はなぜ酸素が少ないのか」）を各モードで試し、順位を比べてみてください。
hint.ROW_ORDER.name=# 位置
hint.ROW_ORDER.title=# — このリストでの位置
hint.ROW_ORDER.what=見ているリストの中で、このパッセージが何番目にあるか。
hint.ROW_ORDER.does=検索後は最終的な順番です: ハイブリッドでは RRF スコア順、BM25 では BM25 スコア順、ベクトルではベクトル距離順。クエリが空のときは、Weaviate がオブジェクトを返した順番にすぎず、ランキングはありません。
hint.ROW_ORDER.theory=検索エンジンの仕事は並べ替えです: 一番上が最も合っていると判断したものです。3 つのモードを比べると、同じ質問でも手法によって順番が変わることが分かります。
hint.CHUNKS.name=📥 パッセージ
hint.CHUNKS.title=📥 パッセージ（チャンク）
hint.CHUNKS.what=文書の小さな断片です — ここでは各サンプルファイルの「## セクション」1 つが 1 パッセージです。
hint.CHUNKS.does=📥 サンプルデータを読み込む はコレクションを削除して作り直し、すべてのパッセージを挿入します。Weaviate は挿入時に各パッセージのベクトルを作ります。
hint.CHUNKS.theory=検索は文書全体ではなくパッセージ単位で行われます: 短く焦点の絞られた断片のほうが質問によく一致し、プロンプトにも収まります。見出しで分割すると、各断片が 1 つのトピックに絞られます。
hint.RECORD.name=🧾 レコード
hint.RECORD.title=🧾 Weaviate のレコード（オブジェクト）
hint.RECORD.what=保存された 1 つのパッセージ: その id（UUID）、フィールド（プロパティ）、ベクトル。
hint.RECORD.does=クラスター → DemoDoc コレクション → オブジェクト UUID に存在します。UUID は「ファイル#セクション」から作られるので、再読み込みしても同じ id になります。表示された REST アドレスで取得できます。
hint.RECORD.theory=UUID は 128 ビットの id です。名前ベースの UUID（バージョン 3）は、同じ名前から常に同じ id を生成します。
hint.SCHEMA.name=🧱 データ構造
hint.SCHEMA.title=🧱 データ構造（コレクションのスキーマ）
hint.SCHEMA.what=すべてのパッセージが持つフィールドと、Weaviate が各フィールドをどうインデックスするか。
hint.SCHEMA.does=title と body は BM25 用に単語へ分割され（title は 2 倍の重み）、ベクトルの元になります。source と chunkNo はフィルター専用です。
hint.SCHEMA.theory=インデックスは 2 種類: BM25 用の転置インデックス（単語 → パッセージ）と、すべてと比較せずに近いベクトルを見つけるためのベクトルインデックス（ここでは Weaviate Cloud が要求する HFresh）。
hint.EMBEDDING.name=🧮 ベクトル
hint.EMBEDDING.title=🧮 ベクトル（埋め込み）
hint.EMBEDDING.what=Weaviate がこのパッセージのために作った数値のリスト — 1024 個の数値です。
hint.EMBEDDING.does=Weaviate 組み込みのベクトライザーが title + body から作ります。質問も同じ方法でベクトル化され、最も近いパッセージのベクトルがベクトル検索の結果になります。
hint.EMBEDDING.theory=各数値は学習された意味の 1 つの次元で、単独では意味を持ちません。似たテキストは同じ方向を向きます。
hint.KEYS.name=🔑 キー
hint.KEYS.title=🔑 キー
hint.KEYS.what=キーが必要なのは Weaviate と OpenRouter の 2 つだけです。Laya（システム 1）は公開されています。
hint.KEYS.does=デフォルトのキーは環境変数（RAGDEMO_WEAVIATE_URL、RAGDEMO_WEAVIATE_KEY、RAGDEMO_OPENROUTER_KEY）から実行時に読み込まれ、表示されることはありません。ここで入力したキーが優先され、メモリにのみ保持され（データベースには保存されません）、呼び出しのたびに読み込まれます。
hint.KEYS.theory=キーをソースコード、git、表示されるデータベースに入れてはいけません。環境変数として設定します（Render → Environment、ローカルではシェル）。ページはどのキーが使われているかだけを示し、キーの文字は一切表示しません。
hint.MODELS.name=🧩 モデル
hint.MODELS.title=🧩 システム 2 のモデル
hint.MODELS.what=システム 2 が使える OpenRouter のモデルで、上から順に試されます。
hint.MODELS.does=一覧から選びます — 🆓 無料モデルが先、💲 有料が後（上限 $0 のキーは無料モデルのみ使用可）。↑ ↓ でフォールバックの順番を決めます。混雑しているモデルは次のモデルに譲ります。
hint.MODELS.theory=コンテキスト = モデルが一度に読めるトークン数。「tools」= モデルが関数を呼び出せること。料金は入力（プロンプト）と出力（回答）それぞれ 100 万トークンあたりです。
hint.OWN_KEYS.name=🔁 自分のキー
hint.OWN_KEYS.title=🔁 自分のキーを使う
hint.OWN_KEYS.what=このデモはサイト管理者が設定したデフォルトのキーで動くので、何も入力せずに使えます。代わりに自分の Weaviate クラスターと OpenRouter キーを使うこともできます。
hint.OWN_KEYS.does=キー（Weaviate ならクラスター URL も）を入力して 💾 保存 を押すと、次の呼び出しからデフォルトの代わりにあなたのキーが使われます。🗑 クリア / 🔄 デフォルト で管理者のキーに戻ります。あなたのキーはメモリにのみ保持され、表示されません。
hint.OWN_KEYS.theory=自分の OpenRouter キーなら有料モデルも選べ、レート制限も別になります。自分の Weaviate クラスターならデータを分けられます（先にそこで 📥 サンプルデータを読み込んでください）。注意: このデモの設定はアプリ全体で 1 つなので、入力したキーはクリアされるかアプリが再起動するまで、サイトを使う全員に適用されます — テスト用のキーを使ってください。
hint.DATABASE.name=💾 アプリのデータベース
hint.DATABASE.title=💾 アプリのデータベース（H2 + JPA）
hint.DATABASE.what=アプリ内の小さな SQL データベース（H2、ディスク上のファイル）です。パッセージは Weaviate に、アプリ自身が保持するもの（チャットと設定）はここに入ります。
hint.DATABASE.does=CHAT_SESSION = 会話ごとに 1 行、CHAT_MESSAGE = すべての質問と回答（回答はソース・トレース・データフロー付きの JSON）、API_SETTING = 🔑 キー管理で保存したキーと設定（キーはマスク表示）。
hint.DATABASE.theory=アプリは Java オブジェクト（@Entity）を JPA / Hibernate で書き込み、それが SQL の行になります。このカードは SELECT … ORDER BY … LIMIT … OFFSET で 1 ページずつ読み戻します。
