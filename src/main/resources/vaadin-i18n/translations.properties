hint.DATABASE.name=💾 App database
hint.DATABASE.title=💾 The app's database (H2 + JPA)
hint.DATABASE.what=A small SQL database inside the app (H2, a file on disk). Weaviate holds the passages; this one holds what the app itself keeps: chats and settings.
hint.DATABASE.does=CHAT_SESSION = one row per conversation, CHAT_MESSAGE = every question and answer (the answer with its sources, trace and data flow as JSON), API_SETTING = keys and choices saved in 🔑 Key Management (keys shown masked).
hint.DATABASE.theory=The app writes Java objects (@Entity) through JPA / Hibernate, which turns them into SQL rows. This card reads them back with plain SELECT … ORDER BY … LIMIT … OFFSET, one page at a time.
hint.LEARNING.name=🧠 Self-learning
hint.LEARNING.title=🧠 Self-learning — verified answers, reused
hint.LEARNING.what=After an answer, ⚡ System 1 checks it; if it passes, the question and answer are saved in Weaviate as a learned object (kind = learned), kept apart from the passages. A very similar question later gets that answer back at once.
hint.LEARNING.does=Saved only if: it cites a passage [n], ⚡ says it answers the question (≥ 0.70), a cited passage supports it (≥ 0.55) and it gives no orders to an AI (injection < 0.30). Reused only if the new question is very close (distance < 0.15) and ⚡ agrees the stored answer fits it — then System 2 is not called.
hint.LEARNING.theory=This is a semantic answer cache with a guard. Learned objects share the DemoDoc collection (the free Weaviate Cloud plan allows one collection) but never mix with the passages: every passage search filters kind = passage, so a wrong answer can never become a 'fact'. System 1 is the gate both ways — before saving and before reusing.
