# ---- ℹ️ learning hints (name · title · what · does · theory)
hint.RAG.name=💡 RAG
hint.RAG.title=💡 RAG — Retrieval-Augmented Generation
hint.RAG.what=A way to make an AI model answer from your documents instead of from memory alone.
hint.RAG.does=This app looks up passages in Weaviate, lets System 1 keep the useful ones, and gives those to System 2 to write the answer — with numbered citations you can check.
hint.RAG.theory=A language model only knows what it saw in training and can invent facts ("hallucinate"). Putting the right passages into the prompt (retrieval + augmentation) grounds the answer in real text.
hint.WEAVIATE.name=🗄️ Weaviate
hint.WEAVIATE.title=🗄️ Weaviate — the vector database
hint.WEAVIATE.what=A database that stores each passage twice: as words (for keyword search) and as a vector (for meaning search).
hint.WEAVIATE.does=Holds the 3,000 sample passages (1,000 each in English, Vietnamese and Japanese) in the collection DemoDoc and answers two searches for every question: BM25 and nearText. It also turns text into vectors itself (its built-in vectorizer).
hint.WEAVIATE.theory=Classic databases find exact values. A vector database finds the nearest vectors — texts with a similar meaning — using an index so it never has to compare every vector.
hint.SYSTEM1.name=⚡ System 1
hint.SYSTEM1.title=⚡ System 1 — Laya, a decision model
hint.SYSTEM1.what=A small, fast model that answers yes/no questions with a probability (0 to 1). It never writes text.
hint.SYSTEM1.does=For each passage it answers three questions — is it relevant? can it answer? is it a prompt injection? — and the passage is kept or dropped. The kept ones are sorted by "answers".
hint.SYSTEM1.theory="System 1 / System 2" comes from Daniel Kahneman: fast intuition vs slow reasoning. Here a cheap fast model filters, so the expensive model only reads what is worth reading.
hint.SYSTEM2.name=🧠 System 2
hint.SYSTEM2.title=🧠 System 2 — the large language model (LLM)
hint.SYSTEM2.what=A general AI model that writes text. Here: free models on OpenRouter, tried in order.
hint.SYSTEM2.does=Gets the question plus the passages System 1 kept, numbered [1], [2]…, and writes a short answer that cites them. If a model is busy (429) the next one in the list is tried.
hint.SYSTEM2.theory=An LLM predicts the next token (a piece of a word) again and again. It is good at language, but it needs the facts in its prompt to be reliable — that is what RAG gives it.
hint.BM25.name=🔤 BM25
hint.BM25.title=🔤 BM25 — keyword search
hint.BM25.what=The classic search-engine ranking: passages that share the question's words score higher.
hint.BM25.does=Weaviate ranks passages by BM25 over title (counted twice) and body. The score is shown in 🔎 Search Data and as "BM25 #rank" in 📚 Sources.
hint.BM25.theory=BM25 rewards rare words ("PCR", "Cas9") more than common ones ("the"), and words that appear often in a short passage. Great for exact names and codes; blind to synonyms.
hint.VECTOR.name=🧭 Vector search
hint.VECTOR.title=🧭 Vector search — search by meaning
hint.VECTOR.what=Each text becomes a list of numbers (an embedding / vector). Texts with a similar meaning get nearby vectors.
hint.VECTOR.does=Weaviate embeds the question and returns the passages whose vectors are closest. "distance" is how far apart they are: smaller = more similar.
hint.VECTOR.theory=An embedding model is trained so that "warm water holds less oxygen" lands near "gas solubility falls with temperature" even with no shared words. Distance here is cosine distance (angle between vectors).
hint.RRF.name=🔀 RRF
hint.RRF.title=🔀 RRF — Reciprocal Rank Fusion (hybrid search)
hint.RRF.what=A simple way to merge two ranked lists into one.
hint.RRF.does=Every passage gets 1 / (60 + rank) from the BM25 list and from the vector list; the two parts are added. The top 4 go to System 1.
hint.RRF.theory=RRF only uses ranks, not raw scores, so a BM25 score (0…∞) and a distance (0…2) can be combined without tuning. A passage that is good in both lists wins. Paper: Cormack et al., 2009.
hint.LAYA_SCORES.name=⚡ relevant · answers · injection
hint.LAYA_SCORES.title=⚡ relevant · answers · injection
hint.LAYA_SCORES.what=The three probabilities System 1 gives each passage.
hint.LAYA_SCORES.does=Kept only if relevant ≥ 0.45, answers ≥ 0.55 and injection < 0.70 (the same thresholds the Spring AI blog uses for Jev). Then sorted by "answers"; the best 3 go to System 2.
hint.LAYA_SCORES.theory=These are calibrated yes/no probabilities, not text. A threshold turns a probability into a decision — lower it to keep more, raise it to be stricter.
hint.INJECTION.name=🛡️ Prompt injection
hint.INJECTION.title=🛡️ Prompt injection
hint.INJECTION.what=Text hidden in a document that tries to give orders to the AI ("ignore all previous instructions…").
hint.INJECTION.does=System 1 scores every passage for it; a likely injection is dropped before System 2 ever sees it. The sample data has one planted note to show this.
hint.INJECTION.theory=RAG puts outside text into the prompt, so that text can try to take control. Filtering before generation is one layer of defence; it is the #1 risk in the OWASP Top 10 for LLM apps.
hint.SOURCES.name=📚 Sources
hint.SOURCES.title=📚 Sources
hint.SOURCES.what=Every passage the search found for this question, and what happened to it.
hint.SOURCES.does=Shows each passage's BM25 rank, vector rank, RRF score, System 1's three scores and ✅ kept / 🚫 dropped. [n] marks the passages System 2 was given and may cite.
hint.SOURCES.theory=Showing sources makes an AI answer checkable — a core idea of RAG.
hint.TRACE.name=🔬 Trace
hint.TRACE.title=🔬 Trace
hint.TRACE.what=Timings and numbers for each step of this answer.
hint.TRACE.does=How long Weaviate, System 1 and System 2 took, which model answered, how many tokens went in and out, and which models were skipped.
hint.TRACE.theory=A token is a piece of a word (about ¾ of an English word). Models are limited and priced by tokens.
hint.DATA_FLOW.name=🔀 Data flow
hint.DATA_FLOW.title=🔀 Data flow
hint.DATA_FLOW.what=The whole trip of one question as a sequence diagram.
hint.DATA_FLOW.does=One column per part (User, App, Weaviate, System 1, System 2), one numbered arrow per step with its start time and duration. Solid = a call, dashed green = a reply, a loop = work inside the app.
hint.DATA_FLOW.theory=Sequence diagrams come from UML; they show who talks to whom, in what order — the best way to understand a pipeline.
hint.PROGRESS.name=⏳ Progress
hint.PROGRESS.title=⏳ Progress steps
hint.PROGRESS.what=Where your question is right now.
hint.PROGRESS.does=🗄️ searching Weaviate → ⚡ System 1 checking passages → 🧠 System 2 writing. ⛔ marks the step whose service failed; ➖ means System 2 was not needed (no passage kept).
hint.PROGRESS.theory=Each step reports itself as it starts, and the page is updated live (server push).
hint.FAIL_CLOSED.name=🚦 Service status
hint.FAIL_CLOSED.title=🚦 Service status — fail closed
hint.FAIL_CLOSED.what=All three services are required. 🟢 ready · 🟡 waking up / busy / no data · 🔴 down.
hint.FAIL_CLOSED.does=If any one is not 🟢, the chat is disabled and the banner says why. The status is checked every 30 s.
hint.FAIL_CLOSED.theory="Fail closed" means: when a safety step cannot run, do nothing rather than continue without it — so no unchecked passage ever reaches the LLM.
hint.HISTORY.name=📂 History
hint.HISTORY.title=📂 History
hint.HISTORY.what=Every conversation, saved in the app's local H2 database.
hint.HISTORY.does=Click a row for a short card, double-click to read it with all its Sources, Trace and Data flow; ▶ Continue here asks more in the same conversation.
hint.HISTORY.theory=Each answer is stored with its whole trace as JSON, so it can be shown again exactly as it happened. On Render the database is emptied on every restart.
hint.SEARCH_MODES.name=🔎 Search modes
hint.SEARCH_MODES.title=🔎 BM25 · Vector · Hybrid
hint.SEARCH_MODES.what=Three ways to search the same passages.
hint.SEARCH_MODES.does=BM25 = by words, Vector = by meaning, Hybrid = both merged with RRF (what the chat uses). Only the columns a mode fills are shown.
hint.SEARCH_MODES.theory=Try a keyword question ("Newton's second law") and a meaning question ("why does warm water hold less oxygen") in each mode and compare the ranks.
hint.ROW_ORDER.name=# Position
hint.ROW_ORDER.title=# — the position in this list
hint.ROW_ORDER.what=Where this passage stands in the list you are looking at.
hint.ROW_ORDER.does=After a search it is the final order: by RRF score in Hybrid, by BM25 score in BM25, by vector distance in Vector. With an empty query it is just the order Weaviate returns the objects in — no ranking.
hint.ROW_ORDER.theory=A search engine's job is ordering: the top of the list is what it thinks fits best. Compare the three modes to see that different methods give different orders for the same question.
hint.CHUNKS.name=📥 Passages
hint.CHUNKS.title=📥 Passages (chunks)
hint.CHUNKS.what=Small pieces of the documents — here one per "## section" of each sample file.
hint.CHUNKS.does=📥 Load sample data drops the collection, creates it again and inserts every passage. Weaviate makes each passage's vector while inserting.
hint.CHUNKS.theory=Search works on passages, not whole documents: a small focused passage matches a question better and fits in the prompt. Splitting at headings keeps each passage about one topic.
hint.RECORD.name=🧾 Record
hint.RECORD.title=🧾 A Weaviate record (object)
hint.RECORD.what=One stored passage: its id (UUID), its fields (properties) and its vector.
hint.RECORD.does=Lives in cluster → collection DemoDoc → object UUID. The UUID is made from "file#section", so loading again gives the same id. You can fetch it at the REST address shown.
hint.RECORD.theory=A UUID is a 128-bit id; a name-based UUID (version 3) always gives the same id for the same name.
hint.SCHEMA.name=🧱 Data structure
hint.SCHEMA.title=🧱 Data structure (collection schema)
hint.SCHEMA.what=The fields every passage has and how Weaviate indexes each one.
hint.SCHEMA.does=title and body are split into words for BM25 (title counts twice) and are what the vector is made from; source and chunkNo are only for filtering.
hint.SCHEMA.theory=Two kinds of index: an inverted index (word → passages) for BM25, and a vector index (here HFresh, which Weaviate Cloud requires) to find nearest vectors without comparing all of them.
hint.EMBEDDING.name=🧮 Vector
hint.EMBEDDING.title=🧮 Vector (embedding)
hint.EMBEDDING.what=The list of numbers Weaviate made for this passage — 1024 of them.
hint.EMBEDDING.does=Made by Weaviate's built-in vectorizer from title + body. The question gets a vector the same way; the closest passage vectors are the vector-search hits.
hint.EMBEDDING.theory=Each number is one learned dimension of meaning; no single number means anything alone. Similar texts point in similar directions.
hint.KEYS.name=🔑 Keys
hint.KEYS.title=🔑 Keys
hint.KEYS.what=Only two services need a key: Weaviate and OpenRouter. Laya (System 1) is public.
hint.KEYS.does=Default keys come from environment variables (RAGDEMO_WEAVIATE_URL, RAGDEMO_WEAVIATE_KEY, RAGDEMO_OPENROUTER_KEY), read at runtime and never shown. A key typed here wins; it is held in memory only — never stored in the database — and read on every call.
hint.KEYS.theory=Never put a key in code, in git or in a database you show: set it as an environment variable (Render → Environment, or your shell locally). The page only says which key is in use, never any of its characters.
hint.MODELS.name=🧩 Models
hint.MODELS.title=🧩 System 2 models
hint.MODELS.what=The OpenRouter models System 2 may use, tried top to bottom.
hint.MODELS.does=Pick from the dropdown — 🆓 free models first, 💲 paid below (a key with a $0 limit can only use free ones). ↑ ↓ set the fallback order; a busy model hands over to the next.
hint.MODELS.theory=Context = how many tokens a model can read at once. "tools" = it can call functions. Price is per million tokens in (prompt) and out (answer).
hint.OWN_KEYS.name=🔁 Your own keys
hint.OWN_KEYS.title=🔁 Use your own keys
hint.OWN_KEYS.what=The demo runs on default keys set by the site owner, so it works without typing anything. You can use your own Weaviate cluster and OpenRouter key instead.
hint.OWN_KEYS.does=Type your key (and, for Weaviate, your cluster URL) and press 💾 Save: from the next call on, the app uses yours instead of the defaults. 🗑 Clear / 🔄 Defaults goes back to the owner's keys. Your key is kept in memory only and never shown.
hint.OWN_KEYS.theory=Your own OpenRouter key lets you pick paid models and has its own rate limit; your own Weaviate cluster keeps your data separate (press 📥 Load sample data there first). Note: this demo keeps one set of settings for the whole app, so a typed key applies to everyone using the site until it is cleared or the app restarts — use a test key.

