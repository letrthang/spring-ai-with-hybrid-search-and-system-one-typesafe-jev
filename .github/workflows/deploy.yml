# Deploy to production — ONLY a tag vX.Y.Z that is on `main` (simplified Gitflow, see GITHUB_COMMIT_RULE.md).
# It starts in three ways:
#   - release.yml CALLS it right after it tags the merge of `release/vX.Y.Z` into `main` (the normal path: a tag pushed
#     with a workflow's own GITHUB_TOKEN cannot start another workflow, so the push-tag trigger below would not fire);
#   - a person pushes a tag `v*` that points to a commit on `main`;
#   - by hand, to redeploy or roll back to an existing tag:
#       gh workflow run deploy.yml --ref main -f tag=vX.Y.Z
# A tag that is not on `main`, or is not vX.Y.Z, is refused before anything is deployed.
#
# Render: the service tracks `main` with Auto-Deploy OFF, so a push to `main` deploys nothing — only this workflow does,
# through the deploy hook with `ref=<tagged commit>`. Requires the repo secret RENDER_DEPLOY_HOOK_URL (Render → the
# service → Settings → Deploy Hook; it already carries `?key=`). The URL is never printed.
# Never run it to "test" it: every run deploys production.
# All dates are UTC: the release date is the CHANGELOG heading `## [x.y.z] — YYYY-MM-DD`.
name: Deploy to production

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to deploy (vX.Y.Z on main)"
        required: true
        type: string
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (vX.Y.Z on main), e.g. a previous tag to roll back"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIVE_URL: https://spring-ai-with-hybrid-search-and-system.onrender.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Resolve the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::'${TAG}' is not a vX.Y.Z tag"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Guard - the tag is on main
        id: guard
        run: |
          set -euo pipefail
          git fetch -q origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${{ steps.tag.outputs.tag }} is not on main: production deploys only from main"
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "✅ ${{ steps.tag.outputs.tag }} = $(git rev-parse --short HEAD) on main"

      # ─── repo-specific deploy steps follow (use steps.tag.outputs.version / .tag and steps.guard.outputs.sha) ───
      - name: Check the RENDER_DEPLOY_HOOK_URL secret
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Repo secret RENDER_DEPLOY_HOOK_URL is not set (Render → the service → Settings → Deploy Hook)."; exit 1
          fi

      - name: Check pom version and CHANGELOG
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          # the project's own <version> is the first one in pom.xml (it sits above <parent>)
          POM_VERSION=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -n 1)
          if [ "$POM_VERSION" != "$VERSION" ]; then
            echo "::error::pom.xml version at this tag is '$POM_VERSION', not '$VERSION'. Bump it on the release branch."; exit 1
          fi
          HEADING=$(grep -E "^## \[$(printf '%s' "$VERSION" | sed 's/\./\\./g')\]" CHANGELOG.md | head -n 1 || true)
          if [ -z "$HEADING" ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section."; exit 1
          fi
          if ! printf '%s' "$HEADING" | grep -qE '[0-9]{4}-[0-9]{2}-[0-9]{2}'; then
            echo "::error::The heading '$HEADING' has no date. Write '## [$VERSION] — YYYY-MM-DD' (UTC)."; exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: |
          set -euo pipefail
          ./mvnw -B clean verify
          # totals from the surefire / failsafe XML reports
          read -r T F E S C < <(cat target/surefire-reports/TEST-*.xml target/failsafe-reports/TEST-*.xml 2>/dev/null \
            | grep -o '<testsuite [^>]*>' \
            | awk '{ for (k = 1; k <= NF; k++) { split($k, a, "\""); n = a[2] + 0;
                       if ($k ~ /^tests=/) t += n; else if ($k ~ /^failures=/) f += n;
                       else if ($k ~ /^errors=/) e += n; else if ($k ~ /^skipped=/) s += n }
                     c++ } END { print t+0, f+0, e+0, s+0, c+0 }')
          echo "TESTS_LINE=$T tests, $F failures, $E errors, $S skipped ($C test classes)" >> "$GITHUB_ENV"
          echo "🧪 $T tests, $F failures, $E errors, $S skipped ($C classes)"

      # Render deploys exactly the tagged commit: the hook takes `ref=<sha>` (the commit must be on the tracked branch `main`,
      # which the guard above checked). The hook URL already holds `?key=…`, so the ref is appended with `&`.
      - name: Trigger Render deploy of the tagged commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SHA: ${{ steps.guard.outputs.sha }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "${HOOK}&ref=${SHA}" -o /dev/null
          echo "DEPLOY_TS=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"
          echo "🚀 Render deploy triggered for ${SHA}"

      # The free plan builds the Docker image (~5–10 min) and cold-starts, and the old instance keeps answering
      # meanwhile, so "UP" alone proves nothing: wait until /actuator/info reports build.version = the tag's version.
      # Builds without /actuator/info fall back to /actuator/health = UP.
      - name: Wait for the live app to run the new version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -uo pipefail
          sleep 120
          for i in $(seq 1 70); do
            INFO=$(curl -s -m 60 "$LIVE_URL/actuator/info" || true)
            HEALTH=$(curl -s -m 60 "$LIVE_URL/actuator/health" || true)
            if printf '%s' "$INFO" | grep -q "\"version\":\"$VERSION\"" && printf '%s' "$HEALTH" | grep -q '"status":"UP"'; then
              LIVE_CHECK="\`/actuator/info\` reports build.version $VERSION and \`/actuator/health\` is UP"
              echo "✅ $LIVE_URL runs $VERSION and is UP (attempt $i)"; break
            fi
            if ! printf '%s' "$INFO" | grep -q '"build"' && printf '%s' "$HEALTH" | grep -q '"status":"UP"' && [ "$i" -ge 15 ]; then
              LIVE_CHECK="\`/actuator/health\` is UP (this build exposes no \`/actuator/info\`, so the version was not checked)"
              echo "::warning::$LIVE_URL has no /actuator/info; accepted /actuator/health = UP without a version check."; break
            fi
            if [ "$i" -eq 70 ]; then
              echo "::error::$LIVE_URL did not run $VERSION in time. Check the Render dashboard (Events / Logs)."; exit 1
            fi
            echo "… not on $VERSION yet (attempt $i)"; sleep 20
          done
          {
            echo "### Deployed \`$TAG\` to Render"
            echo "- Build and tests: \`./mvnw clean verify\` on JDK 25 (Temurin) — $TESTS_LINE."
            echo "- Render deploy hook called at $DEPLOY_TS; live at $(date -u +'%Y-%m-%d %H:%M:%S UTC') — $LIVE_CHECK."
            echo "- Live app: $LIVE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
