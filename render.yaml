# Render Blueprint. The service is connected to this GitHub repo in the Render dashboard; Render redeploys on every
# push to the `release` branch (develop → main → release; see GITHUB_COMMIT_RULE.md). No secrets here: the owner's
# default keys are environment variables set in the Render dashboard (RAGDEMO_*).
services:
  - type: web
    name: spring-ai-with-hybrid-search-and-system-one-typesafe-jev
    runtime: docker
    plan: free
    branch: release
    autoDeploy: true
    healthCheckPath: /actuator/health
