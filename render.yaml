# Render Blueprint. The service tracks `main`, but it does NOT auto-deploy: a release is deployed only by
# .github/workflows/deploy.yml (tag vX.Y.Z on main → Render deploy hook with ref=<tagged commit>; see GITHUB_COMMIT_RULE.md).
# Keep Auto-Deploy OFF in the Render dashboard too. No secrets here: the owner's
# default keys are environment variables set in the Render dashboard (RAGDEMO_*).
services:
  - type: web
    name: spring-ai-with-hybrid-search-and-system-one-typesafe-jev
    runtime: docker
    plan: free
    branch: main
    autoDeploy: false
    healthCheckPath: /actuator/health
